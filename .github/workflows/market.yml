name: Unicorn market
on:
  workflow_dispatch:
  schedule:
    # Friday 17:17 and 18:17 JST; margin before 19:30, not an SLA.
    - cron: '17 8,9 * * 5'
    # Final backup: Friday 19:07 JST, with margin for collection/deployment.
    - cron: '7 10 * * 5'
permissions:
  contents: read
concurrency:
  group: unicorn-pages
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 12
    outputs:
      report_sha: ${{ steps.digest.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: dotnet run -- --test
      - name: Collect
        id: collect
        continue-on-error: true
        run: dotnet run --no-build
      - name: Upload report including errors
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Record exact report digest
        id: digest
        run: echo "sha=$(sha256sum site/latest.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Publish sanitized report for GitHub connector
        run: |
          publish_dir=$(mktemp -d)
          cp site/latest.json site/summary.json site/index.html "$publish_dir/"
          cd "$publish_dir"
          git init -b data
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth_header=$(git -C "$GITHUB_WORKSPACE" config --get http.https://github.com/.extraheader)
          if git -c "http.https://github.com/.extraheader=$auth_header" fetch origin data --depth=1; then
            git reset --soft FETCH_HEAD
          fi
          git add latest.json summary.json index.html
          git commit --allow-empty -m "Refresh public Unicorn market report"
          git -c "http.https://github.com/.extraheader=$auth_header" push origin HEAD:data
          remote_sha=$(git -c "http.https://github.com/.extraheader=$auth_header" ls-remote origin refs/heads/data | cut -f 1)
          test "$remote_sha" = "$(git rev-parse HEAD)"
      - name: Preserve this run for 90 days
        uses: actions/upload-artifact@v4
        with:
          name: unicorn-${{ github.run_id }}-${{ github.run_attempt }}
          path: site
          retention-days: 90
      - name: Mark incomplete collection
        if: steps.collect.outcome == 'failure'
        run: echo 'Collection incomplete. Inspect the published error report.' >> "$GITHUB_STEP_SUMMARY"
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public files
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          REPORT_SHA: ${{ needs.collect.outputs.report_sha }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --retry 2 --retry-delay 5 "${PAGE_URL}latest.json?run=${GITHUB_RUN_ID}" -o /tmp/latest.json && echo "$REPORT_SHA  /tmp/latest.json" | sha256sum --check; then
              break
            fi
            if [ "$attempt" = 6 ]; then exit 1; fi
            sleep 10
          done
          python3 - <<'PY'
          import json, datetime
          d=json.load(open('/tmp/latest.json'))
          assert d['world']=='Unicorn' and d['worldId']==30
          age=datetime.datetime.now(datetime.timezone.utc)-datetime.datetime.fromisoformat(d['fetchedAt'])
          assert 0 <= age.total_seconds() < 1800, 'public report stale'
          assert d['status']=='fetched' and d['worldVerified'], 'API incomplete; error report published'
          PY
